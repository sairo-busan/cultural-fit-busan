name: Weekly places refresh

# 매주 일요일 04:00 KST(=토요일 19:00 UTC) — 사람이 가장 적을 시간대.
# TourAPI 원본(places 컬렉션)만 갱신한다. place_info·score_board(유나 태깅·큐레이션)는
# 손대지 않는다 — 수동 큐레이션 데이터라 자동 배치가 덮어쓰면 안 된다.
#
# import-eng-content-id.ts는 여기서 실행하지 않는다 — 개인 조사자료 CSV
# (docs/TourAPI_영문_연결표_71.csv)를 읽는데 그 파일은 커밋하지 않아서 CI엔 없다.
# engContentId는 한 번 세팅되면 재적재 스크립트가 건드리지 않는 필드라 재적재해도
# 유지된다.
#
# ingest-places.ts(부산 전체 2,239곳, 1회 11,000+콜)는 여기서 쓰지 않는다 —
# refresh-curated-places.ts(추천 119곳, 480+콜)로 범위를 좁혔다. 9/14 실제로
# ingest-places.ts를 전체 재실행하다 TourAPI 일일 한도(1,000건)를 넘겨서 그
# 뒤 처리된 장소 59곳의 영업시간·소개가 빈 값으로 덮인 사고가 있었다(소피
# 발견, BE-FEAT-019 PR 리뷰) — refresh-curated-places.ts는 상세 호출 실패 시
# 그 장소를 건드리지 않고 건너뛰어 같은 사고를 막는다.
on:
  schedule:
    - cron: "0 19 * * 6"
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 레포 Actions 기본 권한이 read라 GITHUB_TOKEN으로 이슈를 못 만든다(소피 리뷰) —
    # check-stale-en-fields.ts·check-broken-places.ts가 이슈 생성에 실패해도 조용히
    # 넘어가서(try/catch) 알아채기 어려웠다.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm ci

      - name: Refresh curated places (추천 119곳, TourAPI 원본)
        env:
          TOUR_API_KEY: ${{ secrets.TOUR_API_KEY }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: npx tsx scripts/refresh-curated-places.ts

      - name: Refresh English address (71곳)
        env:
          TOUR_API_KEY: ${{ secrets.TOUR_API_KEY }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: npx tsx scripts/ingest-eng-address.ts

      - name: Refresh English operation info (71곳)
        env:
          TOUR_API_KEY: ${{ secrets.TOUR_API_KEY }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: npx tsx scripts/ingest-eng-operation-info.ts

      - name: Check LLM-translated fields for staleness
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx tsx scripts/check-stale-en-fields.ts

      - name: Check for places excluded by server guard
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx tsx scripts/check-broken-places.ts
